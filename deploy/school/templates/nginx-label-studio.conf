# Managed by deploy/school/install.sh
server {
    listen 80;
    server_name ${SERVER_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SERVER_NAME};

    ssl_certificate     ${TLS_CERT};
    ssl_certificate_key ${TLS_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LabelStudioSSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    # Matches Django's DATA_UPLOAD_MAX_MEMORY_SIZE (250 MB)
    client_max_body_size 250m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/label-studio.access.log;
    error_log  /var/log/nginx/label-studio.error.log warn;

    location /static/ {
        alias ${SRC_DIR}/label_studio/core/static_build/;
        expires 7d;
    }

    location /react-app/ {
        alias ${SRC_DIR}/web/dist/apps/labelstudio/;
        expires 7d;
    }

    location = /nginx_health {
        access_log off;
        return 200;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrites any client-supplied value; Django trusts it via SECURE_PROXY_SSL_HEADER.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
