# Managed by deploy/school/install.sh
[uwsgi]
chdir = ${SRC_DIR}/label_studio
module = core.wsgi:application
# Only nginx on this host talks to the application server.
http-socket = 127.0.0.1:8000
master = true
processes = $(UWSGI_PROCESSES)
enable-threads = true
single-interpreter = true
lazy-apps = true
thunder-lock = true
need-app = true
die-on-term = true
vacuum = true

# Imports/exports run inside the request in the community edition; keep in line with nginx timeouts.
harakiri = 300
harakiri-verbose = true
reload-on-rss = 1024
max-worker-lifetime = 3600
max-worker-lifetime-delta = 60
post-buffering = 65536
buffer-size = 65535

disable-logging = true
log-5xx = true
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

env = APP_WEBSERVER=uwsgi
